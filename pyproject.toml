[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snmp-monitor"
version = "0.1.0"
description = "SNMP monitoring dashboard with a UniFi-style web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pysnmp>=7.1",
    # SNMPv3 の認証・暗号化 (AES/DES) に必要
    "cryptography>=42.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
snmp-monitor = "snmp_monitor.__main__:main"

[tool.setuptools.packages.find]
include = ["snmp_monitor*"]

[tool.setuptools.package-data]
snmp_monitor = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
